server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Entwurfsstand: nicht indexieren lassen
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Bilder und Fonts duerfen liegen bleiben.
    location ~* \.(jpg|jpeg|png|webp|avif|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # CSS/JS bewusst nicht cachen: solange die Seite Entwurf ist, soll jede
    # Aenderung sofort sichtbar sein, ohne dass jemand hart neu laden muss.
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
